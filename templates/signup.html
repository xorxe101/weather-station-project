<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Weather Forecast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='img_icon/pen.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=13">
</head>
<body>
    <div class="dashboard-header">
        <h1>Create Account</h1>
        <a href="/" class="control-btn">Back to Dashboard</a>
    </div>

    <div class="chart-card" style="max-width: 500px; margin: 1.5rem auto; text-align: center;">
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Sign Up</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div id="flash-message" style="background-color: #ffe6e6; color: #cc0000; padding: 1rem; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ffcccc; font-size: 1rem;">
                    {% for message in messages %} {{ message }} {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/signup">
            <input type="text" 
                name="username" 
                maxlength="32" 
                placeholder="Username" 
                required 
                class="modal-input" 
                value="{{ username if username else '' }}"
                style="margin-bottom: 15px;"
                pattern="[a-zA-Z0-9_.]+"
                title="Characters allowed: (A-Z, a-z, 0-9, _, .)"
                oninput="this.value = this.value.replace(/[^a-zA-Z0-9_.]/g, '')">

            <input type="email" 
                name="email" 
                placeholder="Email Address" 
                required
                class="modal-input"
                value="{{ email if email else '' }}"
                style="margin-bottom: 15px;">
            
            <div class="password-wrapper">
                <input type="hidden" name="password" id="real-signup-pass">
                
                <input type="text" id="visible-signup-pass" maxlength="32" placeholder="Password" class="modal-input" autocomplete="off" required>
                
                <button type="button" class="password-toggle" id="signup-toggle-btn">
                    <img src="{{ url_for('static', filename='img_icon/show.png') }}" class="password-icon" alt="Show Password">
                </button>
            </div>
            
            <button type="submit" class="control-btn" style="width: 100%; padding: 15px; font-size: 1.1rem;">Create Account</button>
        </form>
        
        <p style="margin-top: 25px; color: #666; font-size: 1rem;">
            Already have an account? <a href="/login" style="color: #0066cc; font-weight: bold; text-decoration: none;">Login here</a>
        </p>
    </div>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if(document.getElementById('visible-signup-pass')) {
                initMobilePassword('visible-signup-pass', 'real-signup-pass', document.getElementById('signup-toggle-btn'));
            }
        });

        setTimeout(function() {
            var flash = document.getElementById('flash-message');
            if (flash) { flash.style.transition = "opacity 0.5s ease"; flash.style.opacity = "0"; setTimeout(function(){ flash.remove(); }, 500); }
        }, 2000);
    </script>
</body>
</html>
