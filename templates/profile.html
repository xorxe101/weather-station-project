<!DOCTYPE html>
<html>
<head>
    <title>My Profile - Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='img_icon/profile.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=13">
    <style>
        .logout-btn { background-color: #6c757d; color: white; border-color: #6c757d; }
        .logout-btn:hover { background-color: #5a6268; }
        .delete-btn-main { background-color: #dc3545; color: white; border-color: #dc3545; }
        .delete-btn-main:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>My Profile</h1>
        <a href="/" class="control-btn">Back to Dashboard</a>
    </div>

    <div class="chart-card" style="max-width: 600px; margin: 1rem auto;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='img_icon/user.png') }}" 
                 style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid #0066cc; object-fit: cover; margin-bottom: 1rem;">
            <h2 style="margin: 0; color: #333; margin-bottom: 5px;">{{ current_user.username }}</h2>
            <div style="margin-top: 15px;">
                <a href="/logout" class="action-btn logout-btn" 
                    onclick="localStorage.setItem('unit_temp', 'C'); localStorage.setItem('unit_wind', 'kmh');">
                    Logout
                </a>
                <button onclick="deleteAccount()" class="action-btn delete-btn-main">Delete Account</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">

        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;">
            <img src="{{ url_for('static', filename='img_icon/settings.png') }}" 
                alt="Settings" 
                class="prefpass-icon">
            Preferences
        </h3>
        <div class="profile-section">
            
            <div class="setting-item">
                <label>Temperature Unit:</label>
                <div class="toggle-switch">
                    <input type="radio" id="unit-c" name="temp_unit" value="C" onchange="saveUnitPref('temp', 'C')" {% if current_user.temp_unit == 'C' %}checked{% endif %}>
                    <label for="unit-c">°C</label>
                    
                    <input type="radio" id="unit-f" name="temp_unit" value="F" onchange="saveUnitPref('temp', 'F')" {% if current_user.temp_unit == 'F' %}checked{% endif %}>
                    <label for="unit-f">°F</label>
                </div>
            </div>

            <div class="setting-item">
                <label>Wind Speed Unit:</label>
                <div class="toggle-switch">
                    <input type="radio" id="unit-kmh" name="wind_unit" value="kmh" onchange="saveUnitPref('wind', 'kmh')" {% if current_user.wind_unit == 'kmh' %}checked{% endif %}>
                    <label for="unit-kmh">km/h</label>
                    
                    <input type="radio" id="unit-ms" name="wind_unit" value="ms" onchange="saveUnitPref('wind', 'ms')" {% if current_user.wind_unit == 'ms' %}checked{% endif %}>
                    <label for="unit-ms">m/s</label>
                </div>
            </div>

        </div>

        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;">
            <img src="{{ url_for('static', filename='img_icon/password.png') }}" 
                alt="Password Change" 
                class="prefpass-icon">
            Password Change
        </h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/profile">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Current Password</label>
            <div class="password-wrapper" style="margin-top: 0; margin-bottom: 20px;">
                <input type="hidden" name="current_password" id="real-current">
                <input type="text" id="visible-current" class="modal-input" autocomplete="off" required>
                
                <button type="button" class="password-toggle" id="btn-current">
                    <img src="{{ url_for('static', filename='img_icon/show.png') }}" class="password-icon" alt="Show Password">
                </button>
            </div>

            <label style="font-weight: bold; display: block; margin-bottom: 5px;">New Password</label>
            <div class="password-wrapper" style="margin-top: 0; margin-bottom: 20px;">
                <input type="hidden" name="new_password" id="real-new">
                <input type="text" id="visible-new" class="modal-input" autocomplete="off" required>
                
                <button type="button" class="password-toggle" id="btn-new">
                    <img src="{{ url_for('static', filename='img_icon/show.png') }}" class="password-icon" alt="Show Password">
                </button>
            </div>

            <button type="submit" class="control-btn" style="width: 100%; margin-top: 10px;">Update Password</button>
        </form>
    </div>
    <script>
        // Περνάμε τις ρυθμίσεις της βάσης στο JS
        const SERVER_PREFS = {
            isLoggedIn: {{ 'true' if current_user.is_authenticated else 'false' }},
            temp: "{{ current_user.temp_unit if current_user.is_authenticated else 'C' }}",
            wind: "{{ current_user.wind_unit if current_user.is_authenticated else 'kmh' }}"
        };
    </script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Σύνδεση των πεδίων με τη νέα συνάρτηση
            initMobilePassword('visible-current', 'real-current', document.getElementById('btn-current'));
            initMobilePassword('visible-new', 'real-new', document.getElementById('btn-new'));
        });
        // --- AUTO-HIDE FLASH MESSAGES ---
        document.addEventListener('DOMContentLoaded', function() {
            // Βρίσκουμε όλα τα μηνύματα (alerts)
            const alerts = document.querySelectorAll('.alert');
            
            if (alerts.length > 0) {
                // Περιμένουμε 2 δευτερόλεπτα (2000ms)
                setTimeout(function() {
                    alerts.forEach(function(alert) {
                        // 1. Κάνουμε fade-out (σιγά σιγά διάφανο)
                        alert.style.transition = "opacity 0.5s ease";
                        alert.style.opacity = "0";
                        
                        // 2. Μόλις τελειώσει το fade (0.5s), το διαγράφουμε τελείως
                        setTimeout(function() {
                            alert.remove();
                        }, 500); 
                    });
                }, 2000); // <-- ΕΔΩ ΡΥΘΜΙΖΕΙΣ ΤΟΝ ΧΡΟΝΟ (2000 = 2 δευτερόλεπτα)
            }
        });
    </script>
    <button id="floating-theme-btn" class="action-btn" onclick="toggleTheme()" title="Toggle Theme">
        <img src="{{ url_for('static', filename='img_icon/moon.png') }}" 
            class="theme-icon" 
            style="margin: 0; width: 24px; height: 24px;">
    </button>
</body>
</html>
